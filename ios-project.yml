# The iOS build.
#
# Generated by `scripts/ios.sh`, not committed, for the same reason the UI-test
# project is not: `Package.swift` stays the source of truth for the shared code,
# and a second project file kept in step by hand is a second place for the two
# builds to disagree.
#
# The app target compiles the *same* files as the Mac app — the domain model,
# the MRZ parser, the OCR pipeline, the store, the exporter and the design
# language — plus an interface of its own. What it leaves out is listed under
# `excludes` below, and every entry there is something a phone genuinely does
# not have: a Mac window, a `llama-server` process, a command line.
name: CrewListrProiOS

options:
  bundleIdPrefix: com.tsevis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Ad-hoc, and signing is *required* rather than merely allowed. The App
    # Group is what the share extension and the app use to hand a passport from
    # one process to the other, and an entitlement only reaches the binary
    # through a signature: with `CODE_SIGNING_REQUIRED: NO` the build succeeds,
    # the app runs, and `containerURL(forSecurityApplicationGroupIdentifier:)`
    # returns nil — every share silently vanishing with nothing in the log to
    # say why. The Simulator does not check who signed it, only that something
    # did.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES

targetTemplates:
  Shared:
    settings:
      base:
        # The share extension needs the domain types too — it writes a file
        # into the group inbox and nothing more, but it renders the app's own
        # design language while it does it.
        SWIFT_VERSION: "5.10"

targets:

  CrewListrPro:
    type: application
    platform: iOS
    sources:
      - path: Sources/CrewListrProMac
        excludes:
          # The Mac window and everything in it. `UI/Design` is deliberately
          # NOT excluded: the theme, the components and the brand marks are
          # shared, so the two apps are visibly the same product.
          - "UI/*.swift"
          # A command line. iOS has no argv worth reading.
          - "HeadlessExport.swift"
          # A 5.8 GB model served by a spawned process. See the note in
          # `CrewStore`'s local-model section.
          - "LlamaVisionRescuer.swift"
          - "ModelManager.swift"
      - path: Sources/CrewListrProiOS
      - path: Resources
        buildPhase: resources
        excludes: ["iOS"]
      - path: Resources/iOS/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: CrewListrProShare
        embed: true
      - sdk: libsqlite3.tbd
    entitlements:
      path: Sources/CrewListrProiOS/CrewListrPro.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tsevis.crewlisterpro
    info:
      path: Sources/CrewListrProiOS/Info.plist
      properties:
        CFBundleDisplayName: CrewListr Pro
        CFBundleShortVersionString: "${CREWLISTR_VERSION}"
        CFBundleVersion: "${CREWLISTR_BUILD}"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Why each of these is asked for, in the operator's words. iOS shows
        # this sentence verbatim in the permission alert, so it says what the
        # app will do with the access and not merely that it wants it.
        NSPhotoLibraryUsageDescription: >-
          CrewListr Pro reads the passport photographs you choose so it can fill
          in a crew list. Nothing is uploaded and no other photograph is looked
          at.
        NSCameraUsageDescription: >-
          CrewListr Pro uses the camera to scan a passport page. The scan stays
          on this iPhone, encrypted, and is never uploaded.
        # "Open in CrewListr Pro" from Files, Mail and anything else that hands
        # a document to another app.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Identity document
            LSHandlerRank: Alternate
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - public.image
              - com.adobe.pdf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsevis.crewlisterpro.ios
        PRODUCT_NAME: CrewListr Pro
        # The product is called "CrewListr Pro" and a Swift module cannot be,
        # so Xcode would derive `CrewListr_Pro` and every test would import a
        # name with an underscore in it that nothing else in the project uses.
        PRODUCT_MODULE_NAME: CrewListrPro
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  CrewListrProShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/CrewListrProShare
        excludes: ["Info.plist"]
      # The inbox is the whole contract between the extension and the app, and
      # both sides compile the same file rather than agreeing about a path in
      # two places.
      - path: Sources/CrewListrProiOS/Intake/SharedInbox.swift
    entitlements:
      path: Sources/CrewListrProShare/CrewListrProShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tsevis.crewlisterpro
    info:
      path: Sources/CrewListrProShare/Info.plist
      properties:
        CFBundleDisplayName: CrewListr Pro
        CFBundleShortVersionString: "${CREWLISTR_VERSION}"
        CFBundleVersion: "${CREWLISTR_BUILD}"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsevis.crewlisterpro.ios.share
        # Not "CrewListr Pro": the app takes that, and two targets with the
        # same product name compile two Swift modules to the same path. What
        # the operator reads in the share sheet is CFBundleDisplayName above.
        PRODUCT_NAME: CrewListrProShare
        GENERATE_INFOPLIST_FILE: NO
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  CrewListrProiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CrewListrProiOSTests
    dependencies:
      - target: CrewListrPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsevis.crewlisterpro.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CrewListr Pro.app/CrewListr Pro"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  CrewListrPro:
    build:
      targets:
        CrewListrPro: all
        CrewListrProiOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CrewListrProiOSTests
